<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Vehicle Damage Assessment</title>
</head>

<body>

    <h1>AI-Powered Vehicle Damage Assessment</h1>

    <p>Upload a vehicle image for damage assessment.</p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="vehicle_image"
            accept="image/*"
            required
        >

        <br><br>

        <button type="submit">
            Analyze Damage
        </button>

    </form>

</body>

</html>
